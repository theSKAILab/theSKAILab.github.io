- date: "5 December 2023"
  headline: >-
    <strong>Katrina Schweikert featured as a Sustainability Graduate Fellow.</strong>
    SKAI Lab research assistant Katrina Schweikert discusses
    her research using geospatial knowledge graphs to integrate
    environmental data and investigate PFAS contamination,
    alongside her interests in sustainability and environmental justice.
    <a href="https://umaine.edu/sustainabilitysolutions/2023-24-sustainability-graduate-fellow-katrina-schweikert/">Read the Mitchell Center fellowship feature</a>.

- date: "10 October 2023"
  headline: >-
    <strong>NSF funding supports the development of SAWGraph.</strong>
    SKAI Lab director Torsten Hahmann leads a team awarded
    $1.5 million from NSF to develop SAWGraph, an open knowledge
    network connecting PFAS contamination data with information
    about potential sources and environmental pathways.
    <a href="https://umaine.edu/news/2023/10/umaine-leading-development-of-new-state-of-the-art-tool-for-tracking-pfas-nationwide/">Read the UMaine News article</a>.

- date: "16 June 2021"
  headline: >-
    <strong>Connecting forest data through student research.</strong>
    SKAI Lab research assistant Kingsley Wiafe-Kwakye discusses
    his Digital Forest research in an INSPIRES student feature.
    Co-advised by Kate Beard-Tisdale and Torsten Hahmann,
    Kingsley uses ontologies and knowledge graphs to connect
    information about tree species and their environmental conditions.
    <a href="https://umaine.edu/epscor/2021/06/16/inspires-student-feature-kingsley-wiafe-kwakye/">Read the Maine EPSCoR student feature</a>.

- date: "12 January 2016"
  headline: >-
    <strong>Collaborating on new approaches to computing education.</strong>
    SKAI Lab director Torsten Hahmann is a partner in a project
    led by Harlan Onsrud exploring hands-on, team-based computing
    education across the University of Maine System. The project
    brings computing into activities addressing scientific
    and societal challenges.
    <a href="https://umaine.edu/research/2016/01/12/revolutionizing-computing-across-university-maine-system/">Read the UMaine Research announcement</a>.