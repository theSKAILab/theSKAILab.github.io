<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">

  {% include head.html %}

  <body data-baseurl="{{ site.baseurl }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include icons.svg %}

    {% include header.html %}

    <main id="main" class="site-container">
      {{ content }}
    </main>

    {% include footer.html %}

    <script>
      document.querySelectorAll('a[href]').forEach(function (link) {
        const isWebLink =
          link.protocol === 'https:' || link.protocol === 'http:';

        if (isWebLink && link.origin !== window.location.origin) {
          link.target = '_blank';
          link.relList.add('noopener');
        }
      });
    </script>

  </body>

</html>
